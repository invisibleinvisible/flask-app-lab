
<!DOCTYPE html>
<html lang="uk">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мій сайт{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
 
</head>
<body>
    <header>
        <h1>Моє портфоліо</h1>
        <nav>
            <a href="{{ url_for('home') }}">Головна</a>
            <a href="{{ url_for('resume') }}">Резюме</a>
            <a href="{{ url_for('contacts') }}">Контакти</a>
            <a href="{{ url_for('products.products_list') }}">Товари</a>
            <a href="{{ url_for('users.admin') }}">Користувачі</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        {% include "partials/footer.html" %}
    </footer>
</body>
</html>
